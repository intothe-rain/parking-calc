<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주차요금 계산기 · 새봄의료재단 원무팀</title>
<style>
  :root {
    --paper: #f6f2e9;
    --card: #fffdf8;
    --ink: #232323;
    --ink-soft: #3a3a3a;
    --muted: #8b8781;
    --line: #ded8ca;
    --chip: #f2ede2;
    --accent: #e0401c;
    --btn: #171717;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 44px 20px;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
                 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(456px, 100%);
    background: var(--card);
    border: 1.5px solid #262626;
    border-radius: var(--radius);
    padding: 26px 26px 24px;
    box-shadow: 0 20px 44px rgba(48, 38, 22, .10);
  }

  .org {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -.01em;
    color: #7c7973;
  }

  .title {
    margin: 0 0 30px;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -.035em;
    color: #1f1f1f;
  }

  .field { min-width: 0; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -.012em;
    color: #2c2c2c;
  }

  input[type="time"],
  select {
    width: 100%;
    height: 52px;
    padding: 0 12px 0 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fffefb;
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    letter-spacing: -.01em;
    transition: border-color .16s ease, box-shadow .16s ease;
  }

  input[type="time"] {
    padding-right: 6px;
    font-variant-numeric: tabular-nums;
  }

  input[type="time"]::-webkit-calendar-picker-indicator {
    opacity: .55;
    cursor: pointer;
    transform: scale(1.05);
    transition: opacity .16s ease;
  }

  input[type="time"]:hover::-webkit-calendar-picker-indicator { opacity: .85; }

  select {
    -webkit-appearance: none;
    appearance: none;
    padding-right: 42px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%234a4a4a' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  input[type="time"]:focus,
  select:focus {
    outline: none;
    border-color: #2a2a2a;
    box-shadow: 0 0 0 3px rgba(35, 35, 35, .09);
  }

  .calc {
    width: 100%;
    height: 56px;
    margin-top: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--btn);
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.015em;
    cursor: pointer;
    transition: background .16s ease, transform .12s ease, box-shadow .16s ease;
  }

  .calc:hover { background: #000; box-shadow: 0 8px 18px rgba(20, 20, 20, .16); }
  .calc:active { transform: translateY(1px) scale(.997); }
  .calc:focus-visible { outline: 2px solid #777; outline-offset: 3px; }

  .result {
    margin-top: 22px;
    padding: 25px 18px 21px;
    border-radius: 12px;
    background: var(--chip);
    text-align: center;
  }

  .amount {
    margin: 0;
    font-size: 37px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -.035em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .amount.pop { animation: pop .22s ease-out; }

  @keyframes pop {
    from { opacity: .35; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .meta {
    margin: 10px 0 0;
    font-size: 14px;
    letter-spacing: -.01em;
    color: var(--muted);
  }

  .meta.empty { color: #b04a35; }

  .rules {
    margin: 22px 0 0;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: -.012em;
    color: #8b8781;
  }

  .rules span { display: block; }

  .calc:disabled { opacity: .6; cursor: progress; }

  .records {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1.5px solid var(--line);
  }

  .records-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .records-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.015em;
    color: #2c2c2c;
  }

  .records-head .hint {
    font-size: 12px;
    letter-spacing: -.01em;
    color: var(--muted);
  }

  .record-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
  }

  .record-list li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffefb;
    animation: pop .22s ease-out;
  }

  .record-main {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -.012em;
    color: #2c2c2c;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .record-sub {
    margin-top: 2px;
    font-size: 12px;
    letter-spacing: -.01em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .record-fee {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .record-note {
    min-height: 15px;
    margin: 8px 0 0;
    font-size: 12px;
    letter-spacing: -.01em;
    color: var(--muted);
  }

  .record-note.error { color: #b04a35; }

  @media (max-width: 420px) {
    .card { padding: 22px 18px 20px; }
    .title { font-size: 26px; }
    .amount { font-size: 32px; }
    .two-col { gap: 10px; }
    input[type="time"] { font-size: 15px; padding-left: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="card">
  <p class="org">새봄의료재단 원무팀</p>
  <h1 class="title">주차요금 계산기</h1>

  <form id="calcForm" novalidate>
    <div class="two-col">
      <div class="field">
        <label for="inTime">들어온 시각</label>
        <input id="inTime" type="time" value="09:10" step="60" required>
      </div>
      <div class="field">
        <label for="outTime">나간 시각</label>
        <input id="outTime" type="time" value="11:45" step="60" required>
      </div>
    </div>

    <div class="field" style="margin-bottom:18px">
      <label for="visitor">방문 구분</label>
      <select id="visitor">
        <option value="outpatient" selected>외래 환자</option>
        <option value="guardian">입원 환자 보호자</option>
        <option value="general">일반 방문</option>
        <option value="staff">직원</option>
      </select>
    </div>

    <button type="submit" class="calc">요금 계산하기</button>
  </form>

  <section class="result" aria-live="polite">
    <p class="amount" id="amount">2,000원</p>
    <p class="meta" id="meta">155분 주차 · 무료 120분</p>
  </section>

  <p class="rules">
    <span>기본 30분 무료 · 이후 10분마다 500원 · 하루 최대 15,000원</span>
    <span>외래 환자 2시간 무료 · 입원 환자 보호자 50% 할인 · 직원 무료</span>
  </p>

  <section class="records" aria-labelledby="recordsTitle">
    <div class="records-head">
      <h2 id="recordsTitle">최근 기록</h2>
      <span class="hint">최근 5건</span>
    </div>
    <ul class="record-list" id="recordList" aria-live="polite"></ul>
    <p class="record-note" id="recordNote">기록을 불러오는 중…</p>
  </section>
</main>

<script>
(function () {
  "use strict";

  /* ---- 요금 규칙 ---- */
  var BASE_FREE_MIN = 30;      // 기본 30분 무료
  var UNIT_MIN      = 10;      // 이후 10분마다
  var UNIT_WON      = 500;     // 500원
  var DAILY_CAP     = 15000;   // 하루 최대 15,000원

  var POLICY = {
    outpatient: { free: 120, discount: 0,    note: "" },
    guardian:   { free: BASE_FREE_MIN, discount: 0.5, note: "보호자 50% 할인" },
    general:    { free: BASE_FREE_MIN, discount: 0,   note: "" },
    staff:      { free: BASE_FREE_MIN, discount: 1,   note: "직원 무료" }
  };

  var form    = document.getElementById("calcForm");
  var inTime  = document.getElementById("inTime");
  var outTime = document.getElementById("outTime");
  var visitor = document.getElementById("visitor");
  var amountEl = document.getElementById("amount");
  var metaEl   = document.getElementById("meta");
  var calcBtn  = form.querySelector(".calc");
  var recordListEl = document.getElementById("recordList");
  var recordNoteEl = document.getElementById("recordNote");

  /* ---- Supabase (공개용 publishable 키만 사용) ---- */
  var SUPABASE_URL  = "https://pmanumnqqvdbkslvczeb.supabase.co";
  var SUPABASE_KEY  = "sb_publishable_XxCnDAvOC_awZo4vQaa5XQ_Q-Vw9o4-";
  var REST_ENDPOINT = SUPABASE_URL + "/rest/v1/parking_records";
  var RECENT_LIMIT  = 5;

  var VISIT_LABEL = {
    outpatient: "외래 환자",
    guardian: "입원 환자 보호자",
    general: "일반 방문",
    staff: "직원"
  };

  function toMinutes(value) {
    var parts = String(value).split(":");
    if (parts.length !== 2) return null;
    var h = Number(parts[0]);
    var m = Number(parts[1]);
    if (!isFinite(h) || !isFinite(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
    return h * 60 + m;
  }

  function won(n) {
    return n.toLocaleString("ko-KR") + "원";
  }

  function calculate(inVal, outVal, type) {
    var start = toMinutes(inVal);
    var end = toMinutes(outVal);
    if (start === null || end === null) return null;

    var nextDay = false;
    if (end <= start) { end += 24 * 60; nextDay = true; }   // 자정을 넘긴 경우

    var total = end - start;                                 // 총 주차 시간(분)
    if (total <= 0) return null;

    var policy = POLICY[type] || POLICY.outpatient;
    var freeMin = Math.min(policy.free, total);              // 적용되는 무료 시간
    var paidMin = total - freeMin;                           // 과금 대상 시간
    var units = Math.ceil(paidMin / UNIT_MIN);               // 10분 단위 올림
    var raw = units * UNIT_WON;

    var days = Math.max(1, Math.ceil(total / (24 * 60)));     // 일수별 최대 요금
    var cap = DAILY_CAP * days;

    var fee = Math.min(raw, cap);
    fee = Math.round(fee * (1 - policy.discount));
    fee = Math.min(fee, cap);
    fee = Math.max(0, fee);

    return {
      total: total,
      freeMin: freeMin,
      paidMin: paidMin,
      units: units,
      raw: raw,
      cap: cap,
      fee: fee,
      discount: policy.discount,
      note: policy.note,
      nextDay: nextDay
    };
  }

  function render(result) {
    if (!result) {
      amountEl.textContent = "—원";
      metaEl.textContent = "들어온 시각과 나간 시각을 확인해 주세요";
      metaEl.classList.add("empty");
      return;
    }

    metaEl.classList.remove("empty");

    var text = result.total + "분 주차 · 무료 " + result.freeMin + "분";
    if (result.discount > 0 && result.discount < 1) text += " · " + result.note;
    if (result.discount === 1) text += " · " + result.note;
    if (result.nextDay) text += " · 다음날 출차";
    if (result.raw > result.cap) text += " · 일 최대 요금 적용";

    amountEl.textContent = won(result.fee);
    metaEl.textContent = text;

    amountEl.classList.remove("pop");
    void amountEl.offsetWidth;
    amountEl.classList.add("pop");
  }

  function update() {
    render(calculate(inTime.value, outTime.value, visitor.value));
  }

  /* ---- 최근 기록 ---- */
  function apiHeaders(extra) {
    var h = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    };
    if (extra) {
      for (var k in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, k)) h[k] = extra[k];
      }
    }
    return h;
  }

  function two(n) { return (n < 10 ? "0" : "") + n; }

  function stampFor(timeValue, dayOffset) {
    var parts = String(timeValue).split(":");
    if (parts.length !== 2) return null;
    var h = Number(parts[0]);
    var m = Number(parts[1]);
    if (!isFinite(h) || !isFinite(m)) return null;

    var d = new Date();
    d.setHours(h, m, 0, 0);
    if (dayOffset) d.setDate(d.getDate() + dayOffset);
    return d.toISOString();
  }

  function clockText(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return two(d.getMonth() + 1) + "/" + two(d.getDate()) + " " +
           two(d.getHours()) + ":" + two(d.getMinutes());
  }

  function durationText(entry, exit) {
    if (!entry || !exit) return "";
    var a = new Date(entry).getTime();
    var b = new Date(exit).getTime();
    if (!isFinite(a) || !isFinite(b) || b < a) return "";
    return Math.round((b - a) / 60000) + "분";
  }

  function setNote(text, isError) {
    recordNoteEl.textContent = text || "";
    recordNoteEl.classList.toggle("error", !!isError);
  }

  function renderRecords(rows) {
    recordListEl.textContent = "";

    if (!rows || rows.length === 0) {
      setNote("아직 저장된 기록이 없습니다. 요금을 계산하면 자동으로 저장됩니다.");
      return;
    }

    rows.forEach(function (row) {
      var li = document.createElement("li");

      var left = document.createElement("div");

      var main = document.createElement("div");
      main.className = "record-main";
      main.textContent = VISIT_LABEL[row.visit_type] || row.visit_type || "방문 구분 없음";

      var sub = document.createElement("div");
      sub.className = "record-sub";
      var text = clockText(row.entry_time) + " → " + clockText(row.exit_time);
      var dur = durationText(row.entry_time, row.exit_time);
      if (dur) text += " · " + dur;
      sub.textContent = text;

      left.appendChild(main);
      left.appendChild(sub);

      var fee = document.createElement("div");
      fee.className = "record-fee";
      fee.textContent = won(Number(row.fee) || 0);

      li.appendChild(left);
      li.appendChild(fee);
      recordListEl.appendChild(li);
    });

    setNote("가장 최근 " + rows.length + "건을 보여 주고 있습니다.");
  }

  function loadRecords() {
    var url = REST_ENDPOINT +
      "?select=id,visit_type,entry_time,exit_time,fee,recorded_at" +
      "&order=recorded_at.desc,id.desc" +
      "&limit=" + RECENT_LIMIT;

    return fetch(url, {
      headers: apiHeaders({ "Accept": "application/json" })
    })
      .then(function (res) {
        if (!res.ok) throw new Error("기록 조회 실패 (" + res.status + ")");
        return res.json();
      })
      .then(renderRecords)
      .catch(function (err) {
        console.error(err);
        setNote("기록을 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.", true);
      });
  }

  function saveRecord(result) {
    var payload = {
      visit_type: visitor.value,
      entry_time: stampFor(inTime.value, 0),
      exit_time: stampFor(outTime.value, result.nextDay ? 1 : 0),
      fee: result.fee
    };

    if (!payload.entry_time || !payload.exit_time) {
      setNote("시간 형식이 올바르지 않아 기록을 저장하지 않았습니다.", true);
      return Promise.resolve();
    }

    calcBtn.disabled = true;
    setNote("기록을 저장하는 중…");

    return fetch(REST_ENDPOINT, {
      method: "POST",
      headers: apiHeaders({
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      }),
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("기록 저장 실패 (" + res.status + ")");
        return loadRecords();
      })
      .catch(function (err) {
        console.error(err);
        setNote("기록을 저장하지 못했습니다. 네트워크 상태를 확인해 주세요.", true);
      })
      .then(function () {
        calcBtn.disabled = false;
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var result = calculate(inTime.value, outTime.value, visitor.value);
    render(result);
    if (result) {
      saveRecord(result);
    } else {
      setNote("입차·출차 시각을 확인한 뒤 다시 계산해 주세요.", true);
    }
  });

  [inTime, outTime, visitor].forEach(function (el) {
    el.addEventListener("input", update);
    el.addEventListener("change", update);
  });

  update();
  loadRecords();
})();
</script>
</body>
</html>
